schema { query: Query mutation: Mutation }
type Query { order(id: ID!): Order }
type Mutation { createOrder(input: CreateOrderInput!): Order! }
input CreateOrderInput {
  idempotencyKey: String!
  serviceIds: [ID!]!
  scheduledAt: String!
  cardToken: String!
}
type Order {
  id: ID!
  idempotencyKey: String!
  services: [Service!]!
  scheduledAt: String!
  totalCents: Int!
  cardLast4: String!
  status: OrderStatus!
}
type Service { id: ID! name: String! priceCents: Int! durationMinutes: Int! }
enum OrderStatus { PENDING HOLD_PLACED }
