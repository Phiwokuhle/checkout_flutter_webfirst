scalar DateTime
type Query { order(id: ID!): Order }
type Mutation { createOrder(input: CreateOrderInput!): Order! }
input CreateOrderInput { requestId: ID!, serviceIds: [ID!]!, scheduledAt: DateTime!, totalCents: Int!, cardToken: String! }
enum HoldStatus { PENDING PLACED }
type Order { id: ID!, serviceIds: [ID!]!, scheduledAt: DateTime!, totalCents: Int!, createdAt: DateTime!, holdStatus: HoldStatus! }
